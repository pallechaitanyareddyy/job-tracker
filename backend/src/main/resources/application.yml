spring:
  application:
    name: job-tracker-api
  datasource:
    # Settings come from environment variables so secrets never live in Git.
    # DB_PASSWORD has no default on purpose: the app refuses to start without it.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    # At least 32 characters. Comes from the JWT_SECRET environment variable, never from Git.
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: job-tracker-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # false is right for http://localhost. Set COOKIE_SECURE=true once the app runs on https.
    refresh-cookie-secure: ${COOKIE_SECURE:false}
